[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "processpatch"
version = "0.1.0"
description = "ProcessPatch: Operational Rule Compiler with Counterexample-Guided Procedure Repair"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
