<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="ProcessPatch — operational rule compiler. CI for real-world procedures: compile amendments, verify witnesses, approve hash-bound patches."/>
<title>ProcessPatch — CI for real-world procedures</title>
<script src="./config.js"></script>
<link rel="stylesheet" href="./styles.css"/>
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<header class="top">
<div class="brand"><div class="title">ProcessPatch</div><div class="sub">Operational Rule Compiler · CI for real-world procedures</div></div>
<div id="buildBadge" class="badge" role="status">no build yet</div>
<span id="hdrControls" class="top-actions">
<label class="field">Domain <select id="domain"><option value="research_grant">research_grant</option><option value="reimbursement">reimbursement</option></select></label>
<button class="btn sm" onclick="runBuild()">Compile Amendment</button>
<button class="btn ghost sm" onclick="cloudRun()">Run Cloud Execution</button>
<small class="api-inline">API <input id="apiBase" value="http://localhost:8000" style="width:180px" aria-label="API base URL"/></small>
<button class="btn ghost sm" onclick="toggleJudge()">Judge Mode</button>
<button id="authBtn" class="btn ghost sm" onclick="authToggle()">Sign in</button>
</span>
</header>
<div class="shell">
<nav class="side" id="tabs" aria-label="Build sections"></nav>
<main id="view" tabindex="-1"></main>
</div>
<div id="judgebar" class="judgebar" style="display:none" aria-label="Judge mode guide"></div>
<div id="drawerRoot"></div>
<script src="./lib/app.js"></script>
</body>
</html>
