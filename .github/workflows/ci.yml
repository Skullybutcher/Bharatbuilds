name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Deterministic verification (131 assertions)
        run: python scripts/verify.py
      - name: Unit/integration suite
        run: python -m pytest tests -q
      - name: Benchmark (26 scenarios)
        run: python scripts/benchmark.py --run-id "BENCH-CI-$GITHUB_SHA"
      - name: Infra validation (no credentials)
        run: python scripts/validate_infra.py
