name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Deterministic verification suite
        run: python scripts/verify.py
      - name: Unit/integration suite
        run: python -m pytest tests -q
      - name: Benchmark (26 scenarios)
        run: python scripts/benchmark.py --run-id "BENCH-CI-$GITHUB_SHA"
      - name: Infra validation (no credentials)
        run: python scripts/validate_infra.py

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check GitHub OIDC context
        run: |
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "event=${{ github.event_name }}"
          echo "workflow=${{ github.workflow }}"
          echo "run_id=${{ github.run_id }}"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::262786914860:role/GitHubActionsProcessPatchDeploy
          aws-region: ap-south-1
          audience: sts.amazonaws.com
          role-session-name: github-actions-${{ github.run_id }}
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - uses: aws-actions/setup-sam@v2
      - name: Deploy backend
        env:
          AMPLIFY_TOKEN: ${{ secrets.AMPLIFY_TOKEN }}
          # Deterministic CORS/Cognito origin — discovery is the fallback for
          # local runs only (T37: app name didn't match the stack pattern and
          # the loud guard correctly refused to guess).
          FRONTEND_ORIGIN: https://main.d1bq8os9dwj0d.amplifyapp.com
        run: bash infra/deploy.sh
