name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Deterministic verification suite
        run: python scripts/verify.py
      - name: Unit/integration suite
        run: python -m pytest tests -q
      - name: Benchmark (26 scenarios)
        run: python scripts/benchmark.py --run-id "BENCH-CI-$GITHUB_SHA"
      - name: Infra validation (no credentials)
        run: python scripts/validate_infra.py

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::262786914860:role/GitHubActionsProcessPatchDeploy
          aws-region: ap-south-1
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - uses: aws-actions/setup-sam@v2
      - name: Deploy backend
        run: bash infra/deploy.sh
